name: Aprender de los resultados

on:
  workflow_dispatch:
  schedule:
    - cron: "13 5 * * *" # cada día a las 05:13 UTC

concurrency:
  group: forecast-and-learn
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn_job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Aprender
        run: |
          poetry run python learn.py
          cat data/learn_report.md >> $GITHUB_STEP_SUMMARY
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Guardar el registro en el repositorio
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data config || true
          if ! git diff --cached --quiet; then
            git commit -m "Registro automático $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi
