name: Prueba con preguntas resueltas

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Número de preguntas"
        default: "60"
      tournament:
        description: "Torneo (33022 = FutureEval verano 2026)"
        default: "33022"
      since:
        description: "Resueltas desde (AAAA-MM-DD)"
        default: "2026-08-15"

permissions:
  contents: write

jobs:
  backtest_job:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Backtest
        run: |
          poetry run python backtest.py --n ${{ inputs.n }} --tournament ${{ inputs.tournament }} --since ${{ inputs.since }}
          cat data/backtest_report.md >> $GITHUB_STEP_SUMMARY
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add data || true
          if ! git diff --cached --quiet; then
            git commit -m "Resultados de la prueba $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
          fi
